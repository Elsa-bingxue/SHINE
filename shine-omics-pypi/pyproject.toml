[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shine-omics"
version = "0.1.0"
description = "Spatial RNA and metabolomics integration with attention and hypergraph-derived propagation"
readme = "README.md"
requires-python = ">=3.8,<3.12"
authors = [{name = "Bing-Xue Du", email = "dubingxue73@gmail.com"}]
keywords = ["spatial omics", "spatial transcriptomics", "spatial metabolomics", "multi-omics", "hypergraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Numerical pins retain the figure analysis environment. PyG is not required.
dependencies = [
  "torch>=1.8,<2.3",
  "numpy==1.23.5",
  "scipy==1.10.1",
  "pandas==1.5.3",
  "scikit-learn==1.3.2",
  "tqdm>=4.60",
]

[project.optional-dependencies]
analysis = [
  "numba==0.58.1",
  "statsmodels==0.14.1",
  "h5py==3.11.0",
  "anndata==0.9.2",
  "scanpy==1.9.8",
  "umap-learn==0.5.7",
  "igraph==0.11.8",
  "leidenalg==0.10.2",
  "matplotlib==3.7.5",
  "seaborn==0.13.2",
  "nbformat>=5.7,<6",
  "ipykernel>=6,<7",
]
dev = ["build>=1,<2", "twine>=6,<8"]

[project.urls]
Homepage = "https://github.com/Elsa-bingxue/SHINE"
Repository = "https://github.com/Elsa-bingxue/SHINE"
Issues = "https://github.com/Elsa-bingxue/SHINE/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["shine", "shine.*"]
exclude = ["shine_src*", "tests*", "build*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.data-files]
"share/shine-omics" = ["README.md", "CHANGELOG.md"]
"share/shine-omics/docs" = ["docs/*.md", "docs/*.txt"]
"share/shine-omics/configs" = ["configs/*.json"]
"share/shine-omics/examples" = ["examples/*.py"]
